[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguide"
version = "0.1.0"
description = "A grounded support assistant for a fictional online store"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "PyYAML>=6,<7",
    "httpx>=0.28,<1",
]

[project.scripts]
storeguide-ingest = "storeguide.ingest:main"
storeguide-retrieve = "storeguide.retrieve:main"
storeguide-eval = "storeguide.evaluation:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storeguide = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
